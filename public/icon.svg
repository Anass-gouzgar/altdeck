<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="102" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Deck Grid Elements -->
  <g filter="url(#glow)">
    <!-- 4 Stream Deck Key Tiles -->
    <rect x="80" y="80" width="150" height="150" rx="32" fill="#1E293B" stroke="#06B6D4" stroke-width="3" />
    <circle cx="155" cy="155" r="32" fill="#06B6D4" fill-opacity="0.2" />
    <path d="M145 140 L172 155 L145 170 Z" fill="#38BDF8" />

    <rect x="282" y="80" width="150" height="150" rx="32" fill="#1E293B" stroke="#6366F1" stroke-width="3" />
    <!-- Volume Speaker Icon -->
    <path d="M335 155 L350 142 L362 142 L362 168 L350 168 Z" fill="#818CF8" />
    <path d="M372 145 C377 150 377 160 372 165" stroke="#818CF8" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M380 138 C388 147 388 163 380 172" stroke="#818CF8" stroke-width="4" stroke-linecap="round" fill="none" />

    <rect x="80" y="282" width="150" height="150" rx="32" fill="#1E293B" stroke="#8B5CF6" stroke-width="3" />
    <!-- Brightness Sun Icon -->
    <circle cx="155" cy="357" r="22" fill="#A78BFA" />
    <line x1="155" y1="322" x2="155" y2="328" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" />
    <line x1="155" y1="386" x2="155" y2="392" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" />
    <line x1="120" y1="357" x2="126" y2="357" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" />
    <line x1="184" y1="357" x2="190" y2="357" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" />

    <rect x="282" y="282" width="150" height="150" rx="32" fill="#1E293B" stroke="#EC4899" stroke-width="3" />
    <!-- Power Bolt / Rocket Icon -->
    <path d="M365 330 L342 360 L356 360 L345 385 L375 352 L360 352 Z" fill="#F472B6" />
  </g>
</svg>
